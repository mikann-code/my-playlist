<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY FAVORITE SONGS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="playlist">
    <h2> - PLAYLIST - </h2>
    <ul>
      <li>-NewJeans- NewJeans</li>
      <li>-Lucky Girl Syndrome-ILLIT</li>
      <li>-Blue Heart- IVE</li>
      <li>-GPT- STAYC</li>
      <li>-Dolphin- OH MY GIRL</li>
    </ul>
  </div>

  <div id="menu">
    <h2> - MENU - </h2>
    <ul>
      <li id="sound">SOUND</li>
      <li id="mute">MUTE ON</li>
      <li id="reset">RESET</li>
    </ul>
    <input type="range" value="0.5" min="0" max="1" step="0.05" class="hidden" id="volume">
  </div>

  <main>
    <h1>Music Name</h1>
    <img src="" id="songImage">
    <audio controls id="audio"></audio>

    <section> <!-- コントロール -->
      <div class="timeMeasure">
        <input type="range" value="0" id="bar"></input>
        <span id="restTime"></span>
      </div>
      <div class="buttons">
        <button id="prev">&laquo;</button>
        <span>- - - -</span>
        <button id="play" class="appear">PLAY</button>
        <button id="stop" class="hidden">PAUSE</button>
        <span>- - - -</span>
        <button id="next">&raquo;</button>
      </div>

    </section>
  </main>

  <script src="main.js"></script>
</body>

</html>
